<div class="rounded-lg bg-emerald-50 border border-emerald-200 p-4 text-emerald-900 text-sm">
  <div class="flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-600"></i>
      <span class="font-semibold">Document Processed Successfully</span>
    </div>
    <span class="text-xs bg-emerald-100 text-emerald-800 font-mono px-2 py-0.5 rounded">{{ ingest_time_ms | round(1) }} ms</span>
  </div>

  <div class="mt-3 grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
    <div class="bg-white/80 p-2 rounded border border-emerald-100">
      <span class="text-emerald-700 block text-[11px] uppercase font-medium">File</span>
      <span class="font-semibold text-emerald-950 truncate block" title="{{ filename }}">{{ filename }}</span>
    </div>
    <div class="bg-white/80 p-2 rounded border border-emerald-100">
      <span class="text-emerald-700 block text-[11px] uppercase font-medium">Pages</span>
      <span class="font-semibold text-emerald-950 font-mono text-sm">{{ total_pages }}</span>
    </div>
    <div class="bg-white/80 p-2 rounded border border-emerald-100">
      <span class="text-emerald-700 block text-[11px] uppercase font-medium">Chunks Indexed</span>
      <span class="font-semibold text-emerald-950 font-mono text-sm">{{ total_chunks }}</span>
    </div>
    <div class="bg-white/80 p-2 rounded border border-emerald-100">
      <span class="text-emerald-700 block text-[11px] uppercase font-medium">Model</span>
      <span class="font-semibold text-emerald-950 font-mono text-xs truncate block" title="{{ embedding_model }}">{{ embedding_model }}</span>
    </div>
  </div>

  <div class="mt-3 flex items-center justify-between text-xs text-emerald-800 border-t border-emerald-200/60 pt-2">
    <span>Temporary PDF deleted &bull; FAISS vector index ready in memory.</span>
    <span class="text-emerald-700 font-medium">Chunk size: {{ chunk_size }} | Overlap: {{ chunk_overlap }}</span>
  </div>
</div>
<script>lucide.createIcons();</script>
